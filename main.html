<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nur Prayer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <div class="container p-0 position-relative mx-auto" id="app">

        <!-- Dashboard / Home Page -->
        <div id="dashboardPage" class="d-flex flex-column flex-grow-1 page">
            <header class="app-header">
                <h1 class="brand-title">NUR PRAYER</h1>
            </header>
            <div class="flex-grow-1 overflow-auto px-2 pt-3" id="dashScroll" style="padding-bottom:24px">
                <div id="dashBody"></div>
            </div>
        </div>

        <!-- Current Prayer Page -->
        <div id="currentPage" class="d-none flex-column flex-grow-1 page">
            <header class="app-header d-flex align-items-center gap-2">
                <div class="flex-grow-1 min-w-0">
                    <h5 class="page-title">
                        <i class="fa-regular fa-calendar" style="color:#1b7a4b"></i>
                        <span>Current Prayer</span>
                    </h5>
                    <div id="currentSub" class="page-sub"></div>
                </div>
                <button type="button" class="btn-action-round" id="currentActionBtn">
                    <i class="fa-regular fa-calendar-days fs-5"></i>
                </button>
            </header>
            <div class="flex-grow-1 overflow-auto p-3" id="currentBody" style="padding-bottom:20px"></div>
        </div>

        <!-- Zikir Page -->
        <div id="zikirPage" class="d-none flex-column flex-grow-1 page">
            <header class="app-header d-flex align-items-center gap-2">
                <div class="flex-grow-1 min-w-0">
                    <h5 class="page-title">
                        <i class="fa-solid fa-stopwatch" style="color:#dc3545"></i>
                        <span>Zikir Tracking</span>
                    </h5>
                    <div class="page-sub">Search, filter and track your zikir</div>
                </div>
            </header>
            <div class="flex-grow-1 overflow-auto p-3" id="zikirBody" style="padding-bottom:20px"></div>
        </div>

        <!-- Old Tracking Page -->
        <div id="oldPage" class="d-none flex-column flex-grow-1 page">
            <header class="app-header d-flex align-items-center gap-2">
                <div class="flex-grow-1 min-w-0">
                    <h5 class="page-title">
                        <i class="fa-solid fa-clock-rotate-left" style="color:#cc7a00"></i>
                        <span>Old Tracking</span>
                    </h5>
                    <div id="oldSub" class="page-sub">Select a period to begin</div>
                </div>
                <button type="button" class="btn-action-round" id="oldActionBtn">
                    <i class="fa-solid fa-bookmark fs-5"></i>
                </button>
            </header>
            <div class="flex-grow-1 overflow-auto p-3" id="oldBody" style="padding-bottom:20px"></div>
        </div>

        <!-- Settings Page -->
        <div id="settingsPage" class="d-none flex-column flex-grow-1 page">
            <header class="app-header d-flex align-items-center gap-2">
                <div class="flex-grow-1 min-w-0">
                    <h5 class="page-title">
                        <i class="fa-solid fa-gear" style="color:#1b7a4b"></i>
                        <span>Settings</span>
                    </h5>
                    <div class="page-sub">App preferences</div>
                </div>
            </header>
            <div class="flex-grow-1 overflow-auto p-3" id="settingsBody" style="padding-bottom:20px"></div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="navbar app-bottom-nav flex-shrink-0">
            <div class="container-fluid p-0 h-100">
                <div class="d-flex w-100 h-100">
                    <button class="nav-tab" id="navHome" data-act="go-home">
                        <i class="fa-solid fa-house fs-4"></i><span>Home</span>
                    </button>
                    <button class="nav-tab" id="navCur" data-act="goto-cur">
                        <i class="fa-regular fa-calendar fs-4"></i><span>Current</span>
                    </button>
                    <button class="nav-tab" id="navZikir" data-act="goto-zikir">
                        <i class="fa-solid fa-stopwatch fs-4"></i><span>Zikir</span>
                    </button>
                    <button class="nav-tab" id="navOld" data-act="goto-old">
                        <i class="fa-solid fa-clock-rotate-left fs-4"></i><span>Old</span>
                    </button>
                    <button class="nav-tab" id="navSet" data-act="goto-settings">
                        <i class="fa-solid fa-gear fs-4"></i><span>Settings</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Layered Bottom Sheet (Missed Prayers / Period Info / Set Period) -->
        <div class="offcanvas offcanvas-bottom rounded-top-4" tabindex="-1" id="sheet2" data-bs-scroll="true"
            data-bs-backdrop="true">
            <div class="offcanvas-header border-bottom py-3 d-flex align-items-center gap-2 px-3">
                <button type="button" class="btn-sheet-back" data-bs-dismiss="offcanvas">
                    <i class="fa-solid fa-arrow-left fs-5"></i>
                </button>
                <div class="flex-grow-1 min-w-0">
                    <h5 class="offcanvas-title sheet-title">
                        <i id="sheet2Icon" class="fa-solid fa-clipboard-list" style="color:#1b7a4b"></i>
                        <span id="sheet2Title" class="text-truncate">—</span>
                    </h5>
                    <div id="sheet2Sub" class="sheet-sub text-truncate"></div>
                </div>
            </div>
            <div class="offcanvas-body p-3" id="sheet2Body"></div>
        </div>

        <!-- Hidden date picker -->
        <input type="date" id="dp" tabindex="-1" aria-hidden="true" class="hidden-date-input">

        <!-- Create/Edit Zikir Modal -->
        <div class="modal fade" id="counterModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width:440px">
                <div class="modal-content rounded-4 border-0 shadow">
                    <div class="modal-header border-0 pb-0 align-items-center gap-3 pt-4 px-4">
                        <span class="modal-icon-badge">
                            <i class="fa-solid fa-mosque fs-3 text-success"></i>
                        </span>
                        <h5 class="modal-title fw-bold fs-4 flex-grow-1 mb-0" id="counterModalTitleText">Create Zikir
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body pt-3 px-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold mb-2" for="cName">Zikir Name</label>
                            <div class="field-group">
                                <span class="field-icon"><i class="fa-regular fa-file-lines fs-5"></i></span>
                                <input type="text" class="form-control border-0 ps-3 fs-6" id="cName"
                                    placeholder="Enter zikir name" maxlength="30">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold mb-2" for="cTarget">How many times to count</label>
                            <div class="d-flex align-items-center gap-2">
                                <div class="field-group flex-grow-1">
                                    <span class="field-icon"><i class="fa-solid fa-rotate-left fs-5"></i></span>
                                    <input type="number" class="form-control border-0 ps-3 fs-6" id="cTarget"
                                        placeholder="100" min="1" max="1000000">
                                </div>
                                <button class="btn btn-brand" type="button" id="cTargetPlus">+100</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold mb-2" for="cStart">Start Date</label>
                            <div class="field-group">
                                <span class="field-icon"><i class="fa-regular fa-calendar fs-5"></i></span>
                                <input type="date" class="form-control border-0 ps-3 fs-6" id="cStart">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label fw-bold mb-2" for="cCount">Current Count</label>
                            <div class="d-flex align-items-center gap-2">
                                <div class="field-group flex-grow-1">
                                    <span class="field-icon"><i class="fa-solid fa-rotate-left fs-5"></i></span>
                                    <input type="number" class="form-control border-0 ps-3 fs-6" id="cCount"
                                        placeholder="0" min="0" max="1000000">
                                </div>
                                <button class="btn btn-brand" type="button" id="cCountPlus">+100</button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-2 pb-4 px-4 d-flex flex-column gap-2">
                        <div class="d-flex gap-2 w-100">
                            <button type="button" class="btn fw-bold flex-fill py-3 rounded-3 fs-5 btn-cancel-outline"
                                data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn fw-bold flex-fill py-3 rounded-3 fs-5" id="cResetBtn"
                                style="background:#fff5e6;color:#cc7a00;border:none;display:none">Reset</button>
                            <button type="button" class="btn btn-brand flex-fill py-3 rounded-3 fs-5"
                                id="counterSave">Save</button>
                        </div>
                        <button type="button" class="btn btn-danger fw-bold w-100 py-3 rounded-3 fs-6" id="cDeleteBtn"
                            style="display:none">
                            <i class="fa-solid fa-trash me-1"></i>Delete Zikir
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Count Modal -->
        <div class="modal fade" id="addModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content rounded-4 border-0">
                    <div class="modal-header border-0 pb-0 align-items-center gap-3 pt-4 px-4">
                        <span class="modal-icon-badge">
                            <i class="fa-solid fa-mosque fs-3 text-success"></i>
                        </span>
                        <div class="flex-grow-1 min-w-0">
                            <div class="fw-bold fs-4 text-dark text-truncate" id="addName">—</div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body pt-3 px-4">
                        <div class="card border-0 rounded-4 p-3 mb-3" style="background:#f8faf9">
                            <div class="d-flex align-items-center justify-content-between gap-3">
                                <button class="btn-stepper" type="button" data-act="add-minus">−</button>
                                <input type="number" class="form-control text-center fw-bold border-0 add-value-input"
                                    id="addValue" placeholder="0" min="1" max="1000000" value="10">
                                <button class="btn-stepper" type="button" data-act="add-plus">+</button>
                            </div>
                        </div>
                        <div class="text-center fw-bold" id="addPreview" style="color:#1b7a4b;font-size:1rem">New count:
                            0</div>
                    </div>
                    <div class="modal-footer border-0 pt-2 pb-4 px-4 d-flex gap-2">
                        <button type="button" class="btn btn-light fw-bold flex-fill py-3 rounded-3 fs-5"
                            data-bs-dismiss="modal" style="border:1px solid #dee2e6">Cancel</button>
                        <button type="button" class="btn btn-brand flex-fill py-3 rounded-3 fs-5"
                            id="addConfirm">Add</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="utilities/utility.js"></script>
    <script src="features/app/app.js"></script>
    <script src="features/navigation/navigation.js"></script>
    <script src="features/current-prayer/current-prayer.js"></script>
    <script src="features/dashboard/dashboard.js"></script>
    <script src="features/old-tracking/old-tracking.js"></script>
    <script src="features/settings/settings.js"></script>
    <script src="features/zikir/Zakir.js"></script>
</body>

</html>
