<div class="dash-nav-card bg-white border border-borderGrey rounded-2xl p-4 flex flex-col items-center justify-between cursor-pointer hover:border-brand hover:shadow-sm transition-all min-h-[120px] relative shadow-none"
    role="button" tabindex="0"
    data-bind="attr: { 'data-act': action, 'data-ref': dataRef }">
    <!-- ko if: hasBadge -->
    <span class="dash-tracker-badge absolute top-2.5 right-2.5 text-[10.5px] font-bold leading-none px-2 py-0.5 rounded-full inline-flex items-center justify-center whitespace-nowrap z-[3] pointer-events-none bg-red-100 text-red-600 border border-red-300"
        data-bind="text: badgeText, attr: { id: badgeId, 'data-ref': badgeDataRef }, css: { 'd-none': !badgeVisible() }"></span>
    <!-- /ko -->
    <div class="icon-box icon-box-lg" data-bind="attr: { 'data-ref': iconDataRef }">
        <i data-bind="attr: { class: iconClass }"></i>
    </div>
    <div class="flex items-center justify-center gap-1 text-xs font-bold text-brand mt-2">
        <span class="text-xs font-bold text-brand"
            data-bind="text: title, attr: { 'data-ref': titleDataRef }"></span>
        <i class="fa-solid fa-chevron-right"></i>
    </div>
</div>
