<div class="dash-timeline-card bg-white rounded-2xl p-4 border border-borderGrey flex flex-col gap-3 shadow-none"
    data-ref="page.dashboard.timeline-card">
    <div class="flex items-center justify-between gap-2"
        data-ref="page.dashboard.timeline.header">
        <span class="text-xs font-bold uppercase tracking-wider text-brand"
            data-ref="page.dashboard.timeline.title" data-bind="text: title || 'Daily Prayer Timeline'">Daily Prayer Timeline</span>
        <div class="h-[1px] bg-borderGrey flex-1" data-ref="page.dashboard.timeline.line"></div>
        <div class="w-6 h-6 rounded-full bg-dash-mintBg text-brand flex items-center justify-center text-xs shrink-0"
            title="Daily Prayers" aria-hidden="true"
            data-ref="page.dashboard.timeline.alarm-icon">
            <i class="fa-solid fa-bell"></i>
        </div>
    </div>
    <div class="flex justify-between items-stretch gap-1 w-full" id="dashTimelineNodes"
        data-ref="page.dashboard.timeline.nodes"
        data-bind="template: { name: 'dashboard-timeline-item-template', foreach: items }">
    </div>
</div>
