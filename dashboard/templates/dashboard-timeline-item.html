<div class="flex-1 flex flex-col items-center gap-1.5 text-center min-w-0"
    data-bind="attr: { id: 'dashTimeline' + name, 'data-ref': 'page.dashboard.timeline.item.' + name.toLowerCase() }">
    <div class="icon-box icon-box-md"
        data-bind="attr: { id: 'dashIconBox' + name, 'data-ref': 'page.dashboard.timeline.icon.' + name.toLowerCase() }, css: { 'icon-box-active': isActive }">
        <i data-bind="attr: { class: iconClass }"></i>
    </div>
    <div class="text-xs font-bold text-brand mt-1 truncate"
        data-bind="text: name, attr: { 'data-ref': 'page.dashboard.timeline.name.' + name.toLowerCase() }"></div>
    <div class="text-[11px] text-gr-text font-medium"
        data-bind="text: time, attr: { id: 'dashTime' + name, 'data-ref': 'page.dashboard.timeline.time.' + name.toLowerCase() }">--:--</div>
    <span class="dash-timeline-badge text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider"
        data-bind="text: statusText, attr: { id: 'dashBadge' + name, 'data-ref': 'page.dashboard.timeline.badge.' + name.toLowerCase() }, css: statusBadgeClass">Upcoming</span>
</div>
