<div class="p-3 rounded-2xl bg-white border border-borderGrey shadow-none">
    <div class="flex items-center gap-2 mb-3">
        <div class="icon-box icon-box-sm">
            <i class="fa-solid fa-gear text-brand"></i>
        </div>
        <div>
            <h6 class="font-bold text-brand mb-0" style="font-size: 0.95rem;">Period Settings</h6>
            <div class="text-gr-textMuted text-xs" style="font-size: 11.5px;">Configure range for Old Tasbeeh tracking</div>
        </div>
    </div>

    <!-- Start Date Input -->
    <div class="mb-2">
        <label class="text-xs font-bold text-gr-textMuted mb-1 block font-semibold text-brand mb-1.5"
            for="tbHistPeriodStart">
            <i class="fa-regular fa-calendar-days text-brand mr-1"></i>Start Date
        </label>
        <div class="relative flex items-center rounded-xl border border-borderGrey bg-white focus-within:border-brand overflow-hidden"
            style="border-radius: 8px;">
            <span class="w-10 h-10 flex items-center justify-center text-gr-textMuted shrink-0"
                style="width: 42px; height: 42px;">
                <i class="fa-regular fa-calendar-days text-brand" style="font-size: 15px;"></i>
            </span>
            <input type="date"
                class="border-0 pl-2 w-full px-3.5 py-2.5 rounded-xl border border-borderGrey bg-white text-brand text-sm focus:outline-none focus:border-brand transition-colors"
                style="height: 42px; font-size: 14px;" id="tbHistPeriodStart"
                data-bind="value: startDate">
        </div>
    </div>

    <!-- End Date Input -->
    <div class="mb-3">
        <label class="text-xs font-bold text-gr-textMuted mb-1 block font-semibold text-brand mb-1.5"
            for="tbHistPeriodEnd">
            <i class="fa-solid fa-calendar-check text-brand mr-1"></i>End Date
        </label>
        <div class="relative flex items-center rounded-xl border border-borderGrey bg-white focus-within:border-brand overflow-hidden"
            style="border-radius: 8px;">
            <span class="w-10 h-10 flex items-center justify-center text-gr-textMuted shrink-0"
                style="width: 42px; height: 42px;">
                <i class="fa-solid fa-calendar-check text-brand" style="font-size: 15px;"></i>
            </span>
            <input type="date"
                class="border-0 pl-2 w-full px-3.5 py-2.5 rounded-xl border border-borderGrey bg-white text-brand text-sm focus:outline-none focus:border-brand transition-colors"
                style="height: 42px; font-size: 14px;" id="tbHistPeriodEnd"
                data-bind="value: endDate">
        </div>
    </div>

    <!-- Presets -->
    <div class="mb-3">
        <label class="text-xs font-bold text-gr-textMuted uppercase mb-1 block font-semibold text-brand mb-1.5"
            style="font-size: 10.5px;">Quick Presets</label>
        <div class="flex gap-2 flex-wrap">
            <button type="button"
                class="rounded-full px-3 py-1 border border-borderGrey bg-white text-gr-text hover:bg-surfaceBg transition-colors text-xs py-1.5 rounded-lg"
                style="font-size: 12px;" data-act="tb-hist-preset" data-preset="this-year">This Year</button>
            <button type="button"
                class="rounded-full px-3 py-1 border border-borderGrey bg-white text-gr-text hover:bg-surfaceBg transition-colors text-xs py-1.5 rounded-lg"
                style="font-size: 12px;" data-act="tb-hist-preset" data-preset="6-months">Last 6 Months</button>
            <button type="button"
                class="rounded-full px-3 py-1 border border-borderGrey bg-white text-gr-text hover:bg-surfaceBg transition-colors text-xs py-1.5 rounded-lg"
                style="font-size: 12px;" data-act="tb-hist-preset" data-preset="1-year">Last 1 Year</button>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-2 pt-1">
        <button type="button"
            class="grow rounded-xl py-2 font-bold bg-brand text-white hover:bg-brand-hover transition-colors text-xs py-1.5 px-3 rounded-lg cursor-pointer"
            style="font-size: 13.5px;" data-act="tb-hist-save">
            <i class="fa-solid fa-check mr-1"></i> Save Period Settings
        </button>
        <button type="button"
            class="rounded-xl px-3 py-2 border border-borderGrey bg-white text-gr-text hover:bg-surfaceBg transition-colors text-xs py-1.5 rounded-lg cursor-pointer"
            style="font-size: 13.5px;" data-act="tb-hist-reset" title="Reset Period Settings">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
    </div>
</div>
