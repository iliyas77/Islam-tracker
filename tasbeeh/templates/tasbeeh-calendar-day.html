<button type="button"
    class="tb-cal-day aspect-square rounded-xl flex flex-col items-center justify-center p-1 relative border transition-all cursor-pointer"
    data-bind="attr: { 'data-date': date, 'data-status': status, 'aria-label': ariaLabel }, css: cssClass">
    <span class="text-xs font-bold leading-none" data-bind="text: dayNum"></span>
    <!-- ko if: isCompleted -->
    <span class="text-[9px] font-bold mt-0.5 text-brand leading-none">✓</span>
    <!-- /ko -->
    <!-- ko if: !isCompleted && count -->
    <span class="text-[9px] text-gr-textMuted mt-0.5 leading-none" data-bind="text: count"></span>
    <!-- /ko -->
</button>
