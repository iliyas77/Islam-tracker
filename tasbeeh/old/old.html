<!-- Digital Tasbeeh: Old Tracking (Previous Months) Body Container -->
<div class="grow overflow-auto p-2 pb-5 relative d-none" id="tbOldBody" data-ref="page.tasbeeh.body.old"
    data-bind="visible: currentSubTab() === 'old'">
    <!-- No Previous Months in Period -->
    <div class="border border-borderGrey p-4 text-center rounded-2xl bg-white d-none shadow-none"
        id="tbOldEmptyRange" data-ref="page.tasbeeh.old.empty-range">
        <div class="mb-3">
            <app-icon params="name: 'calendar-xmark', color: 'text-gr-warning', size: '4xl', customClass: 'opacity-75'"></app-icon>
        </div>
        <h5 class="font-bold text-brand mb-2">No Previous Months in Period</h5>
        <p class="text-gr-textMuted text-xs mb-3">
            Your tracking start date is <strong id="tbOldEmptyRangeStart"></strong>, which falls in or after the current period.<br>
            The Old tab displays previous completed months prior to <strong id="tbOldEmptyRangeCur"></strong>.
        </p>
        <button type="button"
            class="px-4 py-2 rounded-xl font-bold mx-auto bg-brand text-white hover:bg-brand-hover transition-colors"
            data-act="tb-open-settings">
            <app-icon params="name: 'calendar-days', customClass: 'mr-2'"></app-icon> Adjust Start Date
        </button>
    </div>

    <!-- All Previous Months Completed -->
    <div class="border border-borderGrey p-4 text-center rounded-2xl bg-white d-none shadow-none"
        id="tbOldAllCompleted" data-ref="page.tasbeeh.old.all-completed">
        <div class="mb-3">
            <app-icon params="name: 'circle-check', color: 'text-brand', size: '4xl'"></app-icon>
        </div>
        <h5 class="font-bold text-brand mb-2">All Previous Months Completed!</h5>
        <p class="text-gr-textMuted text-xs mb-3">
            All previous months back to <span id="tbOldAllCompletedStart"></span> have been completed.
        </p>
        <div class="flex justify-center gap-2">
            <button type="button"
                class="rounded-full px-4 py-2 font-bold border border-brand bg-white text-brand hover:bg-brand-light transition-colors"
                data-act="tb-old-reopen"
                data-bind="click: reopenLastMonth">
                <app-icon params="name: 'rotate-left', customClass: 'mr-1'"></app-icon> Reopen Last Month
            </button>
            <button type="button"
                class="border rounded-full px-3 py-2 text-gr-textMuted text-xs bg-surfaceBg border-borderGrey text-gr-text hover:bg-gray-100 transition-colors"
                data-act="tb-reset-all-completed"
                data-bind="click: resetAllCompleted">
                <app-icon params="name: 'rotate-left', customClass: 'mr-1'"></app-icon> Reset Completed
            </button>
        </div>
    </div>

    <!-- Active Old Month Content -->
    <div class="d-none flex flex-col gap-3" id="tbOldContent" data-ref="page.tasbeeh.old.content">
        <!-- Advance Month Banner -->
        <div class="border border-borderGrey p-3 text-center rounded-2xl bg-white mb-3 d-none shadow-none"
            id="tbOldAdvanceBanner" data-ref="page.tasbeeh.old.advance-banner">
            <div class="text-brand font-bold mb-2">
                <app-icon params="name: 'circle-check', color: 'text-brand', customClass: 'mr-1'"></app-icon> <span id="tbOldAdvanceBannerMsg">All targets are completed!</span>
            </div>
            <button type="button"
                class="font-bold rounded-full px-4 py-2 mx-auto bg-brand text-white hover:bg-brand-hover transition-colors text-xs py-1.5 px-3 rounded-lg"
                data-act="tb-old-advance">
                <app-icon params="name: 'arrow-left', customClass: 'mr-1'"></app-icon> Finalize & Move to Previous Month
            </button>
        </div>

        <!-- Old Tabs Navigation -->
        <div class="flex border-b border-borderGrey bg-white sticky top-0 z-20" role="tablist" aria-label="Old Tasbeeh Status Tabs">
            <!-- To Do Tab -->
            <button type="button" id="tabTbOldTodo" role="tab" aria-selected="true" aria-controls="tbOldTodoList"
                class="flex-1 py-3 flex items-center justify-center gap-2 border-b-2 border-brand text-brand font-bold text-xs uppercase tracking-wider transition-colors cursor-pointer select-none"
                data-bind="click: function(d,e){ switchOldTab('todo', e); }, css: oldActiveTab() === 'todo' ? 'border-brand text-brand font-bold' : 'border-transparent text-gr-textMuted font-semibold hover:text-gr-text'">
                <span>TO DO</span>
                <span id="tbOldTodoBadge" class="text-xs font-bold px-2 py-0.5 rounded-full"
                    data-bind="css: oldActiveTab() === 'todo' ? 'bg-brand-light text-brand' : 'bg-surfaceBg text-gr-textMuted border border-borderGrey', text: oldTodoItems().length">0</span>
            </button>
            <!-- Completed Tab -->
            <button type="button" id="tabTbOldDone" role="tab" aria-selected="false" aria-controls="tbOldDoneList"
                class="flex-1 py-3 flex items-center justify-center gap-2 border-b-2 border-transparent text-gr-textMuted font-semibold text-xs uppercase tracking-wider transition-colors cursor-pointer select-none"
                data-bind="click: function(d,e){ switchOldTab('completed', e); }, css: oldActiveTab() === 'completed' ? 'border-brand text-brand font-bold' : 'border-transparent text-gr-textMuted font-semibold hover:text-gr-text'">
                <span>COMPLETED</span>
                <span id="tbOldDoneBadge" class="text-xs font-bold px-2 py-0.5 rounded-full"
                    data-bind="css: oldActiveTab() === 'completed' ? 'bg-brand-light text-brand' : 'bg-surfaceBg text-gr-textMuted border border-borderGrey', text: oldDoneItems().length">0</span>
            </button>
        </div>

        <!-- TO DO LIST (Single Column List Layout) -->
        <div id="tbOldTodoList" role="tabpanel" aria-labelledby="tabTbOldTodo" class="mt-2 space-y-3"
            data-bind="visible: oldActiveTab() === 'todo'">
            <div class="flex flex-col gap-3" id="tbOldTodoGrid" data-bind="foreach: oldTodoItems">
                <!-- ko component: { name: 'tasbeeh-counter-card', params: $data } --><!-- /ko -->
            </div>
        </div>

        <!-- COMPLETED LIST (Single Column List Layout) -->
        <div id="tbOldDoneList" role="tabpanel" aria-labelledby="tabTbOldDone" class="mt-2 space-y-3 d-none hidden"
            data-bind="visible: oldActiveTab() === 'completed'">
            <div class="flex flex-col gap-3" id="tbOldDoneGrid" data-bind="foreach: oldDoneItems">
                <!-- ko component: { name: 'tasbeeh-counter-card', params: $data } --><!-- /ko -->
            </div>
        </div>
    </div>
</div>
