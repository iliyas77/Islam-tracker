<!-- Digital Tasbeeh: Current Month Body Container -->
<div class="grow overflow-auto p-2 pb-5 relative d-none" id="tbCurrentBody" data-ref="page.tasbeeh.body.current"
    data-bind="visible: currentSubTab() === 'current'">
    <div id="tbList" class="flex flex-col gap-3" data-ref="page.tasbeeh.list">
        <!-- Advance Banner -->
        <div class="border border-borderGrey p-3 text-center rounded-2xl bg-white d-none shadow-none"
            id="tbCurrentAdvanceBanner">
            <app-icon params="name: 'circle-check', color: 'text-brand', size: 'xl', customClass: 'mb-2'"></app-icon>
            <div class="font-bold text-brand" id="tbCurrentAdvanceBannerText">All Dhikrs for this month Completed!</div>
            <div class="text-gr-textMuted text-xs mb-3">All daily targets for this month have been achieved.</div>
            <button type="button"
                class="font-bold rounded-full px-4 py-2 mx-auto bg-brand text-white hover:bg-brand-hover transition-colors text-xs py-1.5 px-3 rounded-lg cursor-pointer"
                data-act="tb-current-advance">
                <app-icon params="name: 'arrow-right', customClass: 'mr-1'"></app-icon> Finalize & Advance to Next Month
            </button>
        </div>

        <!-- Current Tabs Navigation -->
        <div class="flex border-b border-borderGrey bg-white sticky top-0 z-20" role="tablist" aria-label="Current Tasbeeh Status Tabs">
            <!-- To Do Tab -->
            <button type="button" id="tabTbCurrentTodo" role="tab" aria-selected="true" aria-controls="tbCurrentTodoList"
                class="flex-1 py-3 flex items-center justify-center gap-2 border-b-2 border-brand text-brand font-bold text-xs uppercase tracking-wider transition-colors cursor-pointer select-none"
                data-bind="click: function(d,e){ switchCurrentTab('todo', e); }, css: currentActiveTab() === 'todo' ? 'border-brand text-brand font-bold' : 'border-transparent text-gr-textMuted font-semibold hover:text-gr-text'">
                <span>TO DO</span>
                <span id="tbCurrentTodoBadge" class="text-xs font-bold px-2 py-0.5 rounded-full"
                    data-bind="css: currentActiveTab() === 'todo' ? 'bg-brand-light text-brand' : 'bg-surfaceBg text-gr-textMuted border border-borderGrey', text: currentTodoItems().length">0</span>
            </button>
            <!-- Completed Tab -->
            <button type="button" id="tabTbCurrentDone" role="tab" aria-selected="false" aria-controls="tbCurrentDoneList"
                class="flex-1 py-3 flex items-center justify-center gap-2 border-b-2 border-transparent text-gr-textMuted font-semibold text-xs uppercase tracking-wider transition-colors cursor-pointer select-none"
                data-bind="click: function(d,e){ switchCurrentTab('completed', e); }, css: currentActiveTab() === 'completed' ? 'border-brand text-brand font-bold' : 'border-transparent text-gr-textMuted font-semibold hover:text-gr-text'">
                <span>COMPLETED</span>
                <span id="tbCurrentDoneBadge" class="text-xs font-bold px-2 py-0.5 rounded-full"
                    data-bind="css: currentActiveTab() === 'completed' ? 'bg-brand-light text-brand' : 'bg-surfaceBg text-gr-textMuted border border-borderGrey', text: currentDoneItems().length">0</span>
            </button>
        </div>

        <!-- TO DO LIST (Single Column List Layout) -->
        <div id="tbCurrentTodoList" role="tabpanel" aria-labelledby="tabTbCurrentTodo" class="mt-2 space-y-3"
            data-bind="visible: currentActiveTab() === 'todo'">
            <div class="flex flex-col gap-3" id="tbCurrentTodoGrid" data-bind="foreach: currentTodoItems">
                <!-- ko component: { name: 'tasbeeh-counter-card', params: $data } --><!-- /ko -->
            </div>
        </div>

        <!-- COMPLETED LIST (Single Column List Layout) -->
        <div id="tbCurrentDoneList" role="tabpanel" aria-labelledby="tabTbCurrentDone" class="mt-2 space-y-3 d-none hidden"
            data-bind="visible: currentActiveTab() === 'completed'">
            <div class="flex flex-col gap-3" id="tbCurrentDoneGrid" data-bind="foreach: currentDoneItems">
                <!-- ko component: { name: 'tasbeeh-counter-card', params: $data } --><!-- /ko -->
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div id="tbEmptyState" class="border border-borderGrey p-4 text-center rounded-2xl bg-white d-none shadow-none"
        data-ref="page.tasbeeh.empty-state">
        <div class="mb-3" data-ref="page.tasbeeh.empty-state.icon-wrap">
            <app-icon params="name: 'hand-holding-heart', color: 'text-gr-textMuted', size: '3xl', customClass: 'opacity-50', dataRef: 'page.tasbeeh.empty-state.icon'"></app-icon>
        </div>
        <h5 class="font-bold text-brand mb-1" data-ref="page.tasbeeh.empty-state.title">No Dhikr Yet</h5>
        <p class="text-gr-textMuted text-xs mb-0" data-ref="page.tasbeeh.empty-state.text">Tap “+” below to add your first chant and begin counting.</p>
    </div>
</div>
