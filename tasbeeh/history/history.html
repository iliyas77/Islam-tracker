<!-- Digital Tasbeeh: History & Settings Body Container -->
<div class="grow overflow-auto p-2 pb-5 relative d-none" id="tbHistoryBody" data-ref="page.tasbeeh.body.history"
    data-bind="visible: currentSubTab() === 'history'">
    <div class="flex flex-col gap-3 pt-1 pb-4" id="tbHistoryContent" data-ref="page.tasbeeh.history.content">
        <!-- Progress Circle & Stats Component -->
        <!-- ko component: { name: 'tasbeeh-progress-circle', params: historyProgress } --><!-- /ko -->

        <!-- Goal & Period Setter Component -->
        <!-- ko component: { name: 'tasbeeh-goal-setter', params: goalSetter } --><!-- /ko -->

        <!-- Monthly Clearance Breakdown -->
        <div class="p-3 rounded-2xl bg-white border border-borderGrey shadow-none">
            <div class="flex items-center justify-between mb-2">
                <h6 class="font-bold text-brand mb-0" style="font-size: 0.95rem;">Monthly Timeline Breakdown</h6>
                <button type="button"
                    class="bg-transparent border-0 text-brand font-semibold cursor-pointer p-0 underline text-gr-danger text-decoration-none text-xs font-bold d-none"
                    id="tbHistResetCompletedBtn" style="font-size: 11px;" data-act="tb-reset-all-completed"
                    data-bind="click: resetAllCompleted">
                    <app-icon params="name: 'rotate-left', customClass: 'mr-1'"></app-icon> Reset Cleared
                </button>
            </div>
            <div class="text-gr-textMuted text-xs mb-3" style="font-size: 11.5px;">Sequential monthly clearance advances backward month-by-month as dhikrs are completed.</div>
            <div class="flex flex-col gap-2" id="tbHistoryList"></div>
        </div>
    </div>
</div>
