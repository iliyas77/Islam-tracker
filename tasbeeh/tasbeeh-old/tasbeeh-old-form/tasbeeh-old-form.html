<!-- ko if: isOpen -->
<div class="modal fixed inset-0 z-[1100] w-full h-full overflow-y-auto bg-black/45 backdrop-blur-[2px] transition-opacity flex items-center justify-center p-4"
    id="tasbeehOldModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="tbOldModalTitle"
    data-bind="click: handleBackdropClick">
    <div class="modal-dialog relative w-auto m-4 pointer-events-none max-w-[440px] w-full mx-auto min-h-[calc(100%-2rem)] flex items-center justify-center">
        <div class="modal-content relative flex flex-col w-full pointer-events-auto bg-white rounded-2xl border border-borderGrey shadow-2xl p-4"
            data-bind="click: function(d,e){ if(e&&e.stopPropagation)e.stopPropagation(); }">
            <!-- Header -->
            <div class="modal-header border-0 pb-0 flex items-center gap-3 pt-4 px-4">
                <span class="icon-box icon-box-lg">
                    <i class="fa-solid fa-hand-holding-heart text-brand text-xl"></i>
                </span>
                <h5 class="modal-title font-bold text-lg grow mb-0" id="tbOldModalTitle"
                    data-bind="text: isEditMode() ? 'Edit Dhikr' : 'Add New Dhikr'">Add New Dhikr</h5>
                <button type="button"
                    class="w-8 h-8 rounded-lg text-gr-textMuted hover:bg-gray-100 flex items-center justify-center ml-auto cursor-pointer"
                    aria-label="Close"
                    data-bind="click: close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Body -->
            <div class="modal-body pt-3 px-4">
                <!-- Chant Title -->
                <div class="mb-3">
                    <label class="font-bold mb-2 block text-xs font-semibold text-brand mb-1.5" for="tbOldFormTitle">Chant Title</label>
                    <div class="relative flex items-center rounded-xl border border-borderGrey bg-white focus-within:border-brand overflow-hidden">
                        <span class="w-10 h-10 flex items-center justify-center text-gr-textMuted shrink-0">
                            <i class="fa-regular fa-file-lines text-base"></i>
                        </span>
                        <input type="text"
                            class="border-0 pl-3 text-sm w-full px-3.5 py-2.5 rounded-xl border border-borderGrey bg-white text-brand focus:outline-none focus:border-brand transition-colors"
                            id="tbOldFormTitle" placeholder="e.g. SubhanAllah" maxlength="40"
                            data-bind="value: title, valueUpdate: 'afterkeydown'">
                    </div>
                </div>

                <!-- Target Count with Chips -->
                <div class="mb-3">
                    <label class="font-bold mb-2 block text-xs font-semibold text-brand mb-1.5">Daily Target Count</label>
                    <div class="flex gap-2 mb-2" id="tbOldCountChips">
                        <button type="button"
                            class="border border-borderGrey bg-white rounded-xl py-2 px-3.5 font-bold text-sm text-brand transition-all cursor-pointer flex-1"
                            data-count="33"
                            data-bind="click: function(){ selectChip(33); }, css: { 'bg-brand text-white border-brand': !isInfinite() && targetCount() == 33 }">33</button>
                        <button type="button"
                            class="border border-borderGrey bg-white rounded-xl py-2 px-3.5 font-bold text-sm text-brand transition-all cursor-pointer flex-1"
                            data-count="99"
                            data-bind="click: function(){ selectChip(99); }, css: { 'bg-brand text-white border-brand': !isInfinite() && targetCount() == 99 }">99</button>
                        <button type="button"
                            class="border border-borderGrey bg-white rounded-xl py-2 px-3.5 font-bold text-sm text-brand transition-all cursor-pointer flex-1"
                            data-count="100"
                            data-bind="click: function(){ selectChip(100); }, css: { 'bg-brand text-white border-brand': !isInfinite() && targetCount() == 100 }">100</button>
                        <button type="button"
                            class="border border-borderGrey bg-white rounded-xl py-2 px-3.5 font-bold text-sm text-brand transition-all cursor-pointer flex-1"
                            data-count="infinite"
                            data-bind="click: function(){ selectChip('infinite'); }, css: { 'bg-brand text-white border-brand': isInfinite() }">∞</button>
                    </div>
                    <div class="relative flex items-center rounded-xl border border-borderGrey bg-white focus-within:border-brand overflow-hidden">
                        <span class="w-10 h-10 flex items-center justify-center text-gr-textMuted shrink-0">
                            <i class="fa-solid fa-hashtag text-base"></i>
                        </span>
                        <input type="number"
                            class="border-0 pl-3 text-sm w-full px-3.5 py-2.5 rounded-xl border border-borderGrey bg-white text-brand focus:outline-none focus:border-brand transition-colors disabled:opacity-50 disabled:bg-gray-100"
                            id="tbOldFormCount" placeholder="33" min="1" max="9999"
                            data-bind="value: targetCount, enable: !isInfinite(), valueUpdate: 'afterkeydown'">
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer border-0 pt-2 pb-4 px-4 flex gap-2">
                <!-- ko if: isEditMode -->
                <button type="button"
                    class="text-gr-danger border rounded-xl py-3 px-3 shrink-0 bg-surfaceBg border-borderGrey text-gr-text hover:bg-gray-100 transition-colors cursor-pointer"
                    id="tbOldModalDelBtn" title="Delete Dhikr" aria-label="Delete Dhikr"
                    data-bind="click: deleteItem">
                    <i class="fa-solid fa-trash-can text-base"></i>
                </button>
                <!-- /ko -->
                <button type="button"
                    class="border font-bold flex-1 py-3 rounded-xl text-base bg-surfaceBg border-borderGrey text-gr-text hover:bg-gray-100 transition-colors cursor-pointer"
                    data-bind="click: close">Cancel</button>
                <button type="button"
                    class="flex-1 py-3 rounded-xl text-base bg-brand text-white hover:bg-brand-hover transition-colors font-bold cursor-pointer"
                    id="tbOldModalSaveBtn"
                    data-bind="click: save">Save Dhikr</button>
            </div>
        </div>
    </div>
</div>
<!-- /ko -->
