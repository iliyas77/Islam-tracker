<div class="flex items-center justify-between p-2 rounded-3 bg-white border border-borderGrey mb-2"
    data-bind="attr: { 'data-month': monthKey }">
    <div class="flex items-center gap-2 min-w-0">
        <span class="text-muted fw-bold small text-gr-textMuted font-bold text-xs" style="width: 24px; font-size: 11px;"
            data-bind="text: indexText">#1</span>
        <span class="fw-bold text-gr1 small text-truncate font-bold text-brand text-xs truncate" style="font-size: 13.5px;"
            data-bind="text: monthLabel">September 2026</span>
    </div>
    <div class="flex items-center gap-2 shrink-0">
        <span class="badge rounded-pill inline-flex items-center" style="font-size: 10.5px; font-weight: 600; padding: 4px 8px;"
            data-bind="css: badgeClass">
            <app-icon params="name: badgeIcon, customClass: 'mr-1', size: 'xs'"></app-icon>
            <span data-bind="text: badgeText">Completed</span>
        </span>
        <!-- ko if: canReopen -->
        <button type="button"
            class="inline-flex items-center justify-center bg-transparent border border-yellow-500 text-yellow-600 font-semibold rounded-full px-2 py-0 ml-auto text-[11px] hover:bg-yellow-50 transition-colors cursor-pointer select-none"
            data-act="tb-old-reopen" title="Reopen this month to recount"
            data-bind="click: onReopen">
            <app-icon params="name: 'rotate-left', customClass: 'mr-1', size: 'xs'"></app-icon> Reopen
        </button>
        <!-- /ko -->
    </div>
</div>
