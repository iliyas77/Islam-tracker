<!-- ko if: isDone -->
<li class="prayer-row prayer-row-done p-2.5 px-3 bg-surfaceBg border border-transparent rounded-xl flex items-center justify-between opacity-75 transition-all gap-2.5 mb-1.5"
    data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() }">
    <div class="prayer-meta flex items-center gap-2.5 min-w-0"
        data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.meta' }">
        <div class="icon-box icon-box-md icon-done w-[46px] h-[46px] min-w-[46px] min-h-[46px] rounded-2xl bg-[#D1E5DC] text-brand inline-flex items-center justify-center shrink-0 leading-none select-none overflow-hidden"
            data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.avatar' }">
            <i class="fa-solid fa-check text-xl"></i>
        </div>
        <div class="prayer-details flex flex-col gap-0.5 min-w-0"
            data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.details' }">
            <div class="title-wrap flex items-baseline"
                data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.title-wrap' }">
                <span class="prayer-name text-sm font-bold text-brand truncate"
                    data-bind="text: prayer, attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.name' }"></span>
            </div>
            <time class="prayer-time text-xs text-gr-textMuted"
                data-bind="text: time, attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.time' }"></time>
        </div>
    </div>
    <button type="button"
        class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#D1E5DC] text-brand border-0 hover:bg-[#c2ded3] transition-colors cursor-pointer shrink-0 text-xs font-semibold"
        data-bind="attr: { 'data-act': actionAct, 'data-p': prayer, 'data-d': date, 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.action-btn' }"
        title="Tap to mark missed">
        <i class="fa-solid fa-check text-xs"></i> Done
    </button>
</li>
<!-- /ko -->

<!-- ko if: isStandard -->

    data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() }, css: isCurrent ? 'prayer-row-current bg-gradient-to-r from-activeLight to-white border-brand' : 'border-borderGrey hover:border-brand'">
    <div class="prayer-meta flex items-center gap-2.5 min-w-0"
        data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.meta' }">
        <div class="icon-box icon-box-md w-[46px] h-[46px] min-w-[46px] min-h-[46px] rounded-2xl inline-flex items-center justify-center shrink-0 leading-none select-none overflow-hidden"
            data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.avatar' }, css: isCurrent ? 'icon-current bg-brand text-white' : 'bg-dash-mintBg text-brand'">
            <i data-bind="attr: { class: iconClass }"></i>
        </div>
        <div class="prayer-details flex flex-col gap-0.5 min-w-0"
            data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.details' }">
            <div class="title-wrap flex items-baseline"
                data-bind="attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.title-wrap' }">
                <span class="prayer-name text-sm font-bold text-brand truncate"
                    data-bind="text: prayer, attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.name' }"></span>
            </div>
            <time class="prayer-time text-xs text-gr-textMuted"
                data-bind="text: time, attr: { 'data-ref': prefix + '.row.' + prayer.toLowerCase() + '.time' }"></time>
