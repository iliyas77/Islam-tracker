<div class="dua-all-feed flex flex-col gap-2" data-ref="page.duas.all.feed">
    <!-- Loading State -->
    <!-- ko if: isLoading -->
    <div class="text-center py-6 text-gr-textMuted" id="duaLoadingState">
        <div class="w-5 h-5 border-2 border-brand border-t-transparent rounded-full animate-spin inline-block mb-2" role="status"></div>
        <div class="text-xs">Loading Duas...</div>
    </div>
    <!-- /ko -->

    <!-- Error State -->
    <!-- ko if: !isLoading() && (typeof loadError === 'function' ? loadError() : loadError) && !hasResults() -->
    <div class="text-center py-8 text-gr-textMuted text-sm leading-relaxed" id="duaErrorState">
        <div class="text-red-500 mb-2 font-medium" id="duaErrorMessage" data-bind="text: (typeof loadError === 'function' ? loadError() : loadError)">Unable to load Duas data.</div>
        <button type="button" class="px-4 py-2 bg-brand text-white text-xs font-semibold rounded-xl hover:bg-brand-hover cursor-pointer inline-flex items-center gap-1.5" data-act="dua-retry" data-bind="click: handleRetry">Retry</button>
    </div>
    <!-- /ko -->

    <!-- Empty State -->
    <!-- ko if: !isLoading() && !(typeof loadError === 'function' ? loadError() : loadError) && !hasResults() -->
    <div class="text-center py-8 text-gr-textMuted text-sm leading-relaxed" id="duaListEmptyState">
        No duas match your search.
    </div>
    <!-- /ko -->

    <!-- Duas List -->
    <!-- ko if: !isLoading() && hasResults() -->
    <div class="flex flex-col gap-2" id="duaListView" data-bind="foreach: { data: (typeof duas === 'function' ? duas : duas), as: 'item' }">
        <!-- ko component: {
            name: 'dua-all-card',
            params: {
                item: item,
                index: (item && item.index !== undefined) ? item.index : $index(),
                isFav: $parent.isFav(item, (item && item.index !== undefined) ? item.index : $index()),
                isPinned: $parent.isPinned(item, (item && item.index !== undefined) ? item.index : $index()),
                onSelectDua: function(d, i, e) { $parent.handleSelect(d, i, e); },
                onTogglePin: function(d, i, e) { $parent.handleTogglePin(d, i, e); },
                onToggleFav: function(d, i, e) { $parent.handleToggleFav(d, i, e); }
            }
        } --><!-- /ko -->
    </div>
    <!-- /ko -->
</div>
