<!-- Quran Duas Page Template Content -->
<!-- Header Component -->
<!-- ko component: { name: 'dua-header', params: header } --><!-- /ko -->

<div class="grow overflow-auto p-3 relative pb-5" id="duasBody">
    <!-- Pinned Subtab -->
    <div id="duaSubHome" data-bind="visible: currentSubTab() === 'home' || currentSubTab() === 'pinned'">
        <!-- ko component: { name: 'dua-pinned-page', params: pinnedPageParams } --><!-- /ko -->
    </div>

    <!-- All Duas Subtab -->
    <div id="duaSubAll" data-bind="visible: currentSubTab() === 'duas' || currentSubTab() === 'all'">
        <!-- ko component: { name: 'dua-all-page', params: allPageParams } --><!-- /ko -->
    </div>

    <!-- Favourites Subtab -->
    <div id="duaSubFavs" class="d-none" data-bind="visible: currentSubTab() === 'favourites' || currentSubTab() === 'favs'">
        <!-- ko component: { name: 'dua-favourites-page', params: favouritesPageParams } --><!-- /ko -->
    </div>

    <!-- Detail Subtab -->
    <div id="duaSubDetail" class="flex flex-col gap-3 d-none" data-bind="visible: currentSubTab() === 'detail'">
        <button type="button"
            class="self-start mb-3 px-4 py-2 bg-white border border-borderGrey rounded-xl text-xs font-semibold text-brand cursor-pointer hover:bg-brand-light inline-flex items-center gap-1.5 transition-colors mb-2"
            data-act="dua-detail-back"
            data-bind="click: goBack">
            <app-icon params="name: 'arrow-left', customClass: 'mr-1'"></app-icon> Back to list
        </button>

        <!-- Translation Card Component -->
        <!-- ko component: { name: 'dua-translation-toggle', params: detail } --><!-- /ko -->

        <div class="flex items-center justify-between gap-2 mt-4">
            <button type="button"
                class="px-4 py-2.5 rounded-xl bg-brand text-white hover:bg-brand-hover transition-colors font-semibold text-xs cursor-pointer inline-flex items-center justify-center"
                id="duaPrevBtn" data-act="dua-prev"
                data-bind="click: prevDua">Previous</button>
            <div class="flex items-center gap-2">
                <button type="button"
                    class="w-10 h-10 rounded-xl border border-borderGrey bg-white text-brand hover:bg-brand-light cursor-pointer text-base inline-flex items-center justify-center transition-colors"
                    id="duaDetailFavBtn" data-act="dua-detail-toggle-fav" title="Toggle Favourite"
                    data-bind="click: toggleFavCurrent">
                    <!-- ko if: isCurrentFav -->
                    <span id="duaDetailFavIcon"><app-icon params="name: 'heart', color: 'text-heartRed'"></app-icon></span>
                    <!-- /ko -->
                    <!-- ko ifnot: isCurrentFav -->
                    <span id="duaDetailFavIcon"><app-icon params="name: 'heart', prefix: 'fa-regular'"></app-icon></span>
                    <!-- /ko -->
                </button>
                <button type="button"
                    class="w-10 h-10 rounded-xl border border-borderGrey bg-white text-brand hover:bg-brand-light cursor-pointer text-base inline-flex items-center justify-center transition-colors"
                    id="duaDetailPinBtn" data-act="dua-detail-toggle-pin" title="Toggle Pin"
                    data-bind="click: togglePinCurrent">
                    <span id="duaDetailPinIcon" data-bind="css: isCurrentPinned() ? 'text-pinAmber' : 'opacity-50'"><app-icon params="name: 'thumbtack'"></app-icon></span>
                </button>
            </div>
            <button type="button"
                class="px-4 py-2.5 rounded-xl bg-brand text-white hover:bg-brand-hover transition-colors font-semibold text-xs cursor-pointer inline-flex items-center justify-center"
                id="duaNextBtn" data-act="dua-next"
                data-bind="click: nextDua">Next</button>
        </div>
    </div>
</div>

<!-- Bottom Navigation Component -->
<!-- ko component: { name: 'dua-nav-tab', params: { activeTab: currentSubTab } } --><!-- /ko -->
