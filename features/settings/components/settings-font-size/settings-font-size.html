<div class="rounded-2xl border border-borderGrey p-4 mb-3 bg-white flex flex-col shadow-none"
    data-ref="page.settings.font-size.card">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-3" data-ref="page.settings.font-size.header">
        <div class="icon-box icon-box-lg bg-brand-light text-gr-accent font-bold text-base w-10 h-10 rounded-xl flex items-center justify-center"
            data-ref="page.settings.font-size.icon-badge">
            <span>Aa</span>
        </div>
        <div class="flex flex-col min-w-0" data-ref="page.settings.font-size.info">
            <span class="font-bold text-sm" data-ref="page.settings.font-size.title">Font Size</span>
            <span class="text-xs text-gr-textMuted">Adjust reading typography</span>
        </div>
    </div>

    <!-- Buttons Row -->
    <div class="flex gap-2" id="fsBtns" data-ref="page.settings.font-size.buttons-row">
        <!-- ko foreach: buttons -->
        <button type="button"
            data-bind="text: label, attr: { 'data-ref': dataRef }, css: $parent.getButtonClass(size), click: handleClick"></button>
        <!-- /ko -->
    </div>
</div>
