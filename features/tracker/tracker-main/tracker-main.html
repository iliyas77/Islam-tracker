   Nur Prayer — Tracker Main Component Template
   Path: features/tracker/tracker-main/tracker-main.html
   Responsibilities:
     - Root mobile view container for Prayer Tracker feature
     - Coordinates subtabs: Current, Old, Performance, and History
     - Encapsulates header bar, subtab bodies, and bottom navigation
   ============================================================ -->
<!-- Header Component -->
<!-- ko with: header -->
<header class="w-full p-4 shrink-0 bg-white border-b border-borderGrey flex items-center justify-between min-h-[44px]"
    data-ref="page.tracker.header">
    <div class="w-full flex items-center justify-between min-w-0 min-h-[44px]">
        <div class="flex items-center gap-2 min-w-0 grow">
            <button type="button"
                class="w-10 h-10 rounded-xl flex items-center justify-center bg-brand-soft text-brand hover:bg-brand-light active:scale-95 transition-all shrink-0 cursor-pointer"
                data-act="go-home" title="Back to Home" aria-label="Back to Home"
                data-bind="click: goHome"
                data-ref="page.tracker.back-btn">
                <app-icon params="name: 'arrow-left', size: 'base'"></app-icon>
            </button>
            <div class="min-w-0 grow">
                <h5 class="font-bold m-0 text-base text-brand flex items-center gap-2"
                    id="trackerHeaderTitle">
                    <app-icon params="id: 'trackerHeaderIcon', name: iconClass || 'fa-regular fa-calendar-days text-gr-accent'"></app-icon>
                    <span id="trackerHeaderLabel" data-bind="text: label || 'Current Prayer'">Current Prayer</span>
                </h5>
                <div id="oldSub" class="text-xs text-gr-textMuted mt-0.5"
                    data-bind="text: subtitle || 'Select a period to begin', css: { 'd-none': !showSubtitle }">Select a period to begin</div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button type="button"
                class="w-10 h-10 rounded-xl flex items-center justify-center bg-white border border-borderGrey text-brand hover:bg-surfaceBg active:scale-95 transition-all shrink-0 cursor-pointer relative"
                id="currentMissedBtn" data-act="missed-open" title="Missed Prayers"
                aria-label="Missed Prayers" data-ref="page.current.card.header.badge"
                data-bind="visible: !currentSubTab || ko.unwrap(currentSubTab) === 'current', click: openMissed">
                <app-icon params="name: 'triangle-exclamation', size: 'base', dataRef: 'page.current.card.header.badge-icon'"></app-icon>
                <span class="inline-flex items-center justify-center absolute -top-1 -right-1 bg-gr-danger text-white text-[11px] font-bold min-w-[18px] h-[18px] px-1 rounded-full border-2 border-white leading-none z-[2] pointer-events-none"
                    id="currentMissedBadge" data-ref="page.current.card.header.badge-count"
                    data-bind="text: missedCount, css: { 'd-none': !hasMissed() }"></span>
            </button>
            <button type="button"
                class="w-10 h-10 rounded-xl flex items-center justify-center bg-white border border-borderGrey text-brand hover:bg-surfaceBg active:scale-95 transition-all shrink-0 cursor-pointer relative d-none"
                id="oldActionBtn" data-act="old-info" title="Period Summary" aria-label="Period Summary"
                data-ref="page.old.header.summary-btn page.old.card.header.summary-btn"
                data-bind="visible: ko.unwrap(currentSubTab) === 'old', click: openPeriodInfo">
                <app-icon params="name: 'chart-simple', size: 'base'"></app-icon>
            </button>
            <button type="button"
                class="w-10 h-10 rounded-xl flex items-center justify-center bg-white border border-borderGrey text-brand hover:bg-surfaceBg active:scale-95 transition-all shrink-0 cursor-pointer relative d-none"
                id="historyEmptyBtn" data-act="history-empty" title="Empty History"
                aria-label="Empty History" data-ref="page.history.header.empty-btn"
                data-bind="visible: ko.unwrap(currentSubTab) === 'history', click: emptyHistory">
                <app-icon params="name: 'trash-can', size: 'base'"></app-icon>
            </button>
        </div>
    </div>
</header>
<!-- /ko -->

<!-- Current Prayer Page -->
<div class="grow overflow-auto px-2 pt-2 pb-3" id="currentBody" data-ref="page.current.body"
    data-bind="visible: currentSubTab() === 'current'">
    <!-- ko component: { name: 'tracker-current-mobile-view', params: currentParams } --><!-- /ko -->
</div>

<!-- Old Tracking Body -->
<div class="grow overflow-auto px-2 pt-2 pb-3" id="oldBody" data-ref="page.old.body"
    data-bind="visible: currentSubTab() === 'old'">
    <!-- ko component: { name: 'tracker-old-home', params: oldParams } --><!-- /ko -->
</div>

<!-- Performance Page -->
<div class="grow overflow-auto px-2 pt-2 pb-3" id="performanceBody" data-ref="page.performance.body"
    data-bind="visible: currentSubTab() === 'performance'">
    <!-- ko component: { name: 'tracker-performance-page', params: performanceParams } --><!-- /ko -->
</div>

<!-- History Page -->
<div class="grow overflow-auto px-2 pt-2 pb-3" id="historyBody" data-ref="page.history.body"
    data-bind="visible: currentSubTab() === 'history'">
    <!-- ko component: { name: 'tracker-history-page', params: historyParams } --><!-- /ko -->
</div>
