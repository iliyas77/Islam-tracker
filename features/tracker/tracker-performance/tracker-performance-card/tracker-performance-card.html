<div class="rounded-2xl p-3.5 bg-white border border-borderGrey flex flex-col gap-2.5 shadow-none transition-all hover:border-brand"
    data-bind="attr: { 'data-ref': 'page.performance.prayer.' + pLower }, click: handleClick">
    <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-dash-mintBg text-brand flex items-center justify-center shrink-0">
                <app-icon params="name: iconClass, size: '20px'"></app-icon>
            </div>
            <div class="min-w-0">
                <h6 class="font-bold text-brand text-sm mb-0 leading-tight" data-bind="text: name"></h6>
                <div class="text-gr-textMuted text-xs mt-0.5" data-bind="text: time"></div>
            </div>
        </div>
        <div>
            <!-- ko if: isPerfect -->
            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-brand-light text-brand"
                data-bind="text: percentage + '%', attr: { 'data-ref': 'page.performance.prayer.' + pLower + '.pct' }"></span>
            <!-- /ko -->
            <!-- ko ifnot: isPerfect -->
            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-gr-dangerSoft text-gr-danger"
                data-bind="text: percentage + '%', attr: { 'data-ref': 'page.performance.prayer.' + pLower + '.pct' }"></span>
            <!-- /ko -->
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden flex">
        <!-- ko if: isPerfect -->
        <div class="h-full bg-brand rounded-full" data-bind="style: { width: percentage + '%' }"></div>
        <!-- /ko -->
        <!-- ko ifnot: isPerfect -->
        <div class="perf-bar-fill h-full bg-brand" data-bind="style: { width: percentage + '%' }"></div>
        <div class="perf-bar-missed h-full bg-gr-danger" data-bind="style: { width: (100 - percentage) + '%' }"></div>
        <!-- /ko -->
    </div>

    <!-- Summary Details -->
    <div class="flex items-center justify-between text-xs pt-1 border-t border-borderGrey/50">
        <span class="flex items-center gap-1.5 text-brand font-semibold">
            <app-icon params="name: 'circle-check', size: '14px'"></app-icon>
            <span data-bind="text: completed + ' Completed'"></span>
        </span>
        <span class="flex items-center gap-1.5" data-bind="css: isPerfect ? 'text-gray-400 font-medium' : 'text-gr-danger font-semibold'">
            <app-icon params="name: isPerfect ? 'circle-xmark' : 'circle-exclamation', size: '14px'"></app-icon>
            <span data-bind="text: missed + ' Missed'"></span>
        </span>
    </div>
</div>
