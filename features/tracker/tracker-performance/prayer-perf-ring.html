<div class="rounded-2xl p-4 bg-white border border-borderGrey flex flex-col gap-3"
    data-ref="page.performance.hero-card">
    <div class="flex items-center justify-between">
        <!-- Circular Progress Ring -->
        <div class="w-[88px] h-[88px] relative flex items-center justify-center shrink-0">
            <svg class="w-full h-full -rotate-90" viewBox="0 0 36 36">
                <path class="stroke-gray-200" stroke-width="3.5" fill="none"
                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="stroke-brand transition-all duration-500" id="perfRingVal"
                    data-bind="attr: { 'stroke-dasharray': dashArray || '0, 100' }"
                    stroke-dasharray="0, 100" stroke-width="3.5" stroke-linecap="round" fill="none"
                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <div class="absolute flex flex-col items-center justify-center text-center">
                <span class="text-base font-bold text-brand leading-none" id="perfHeroPercentage"
                    data-ref="page.performance.hero-percentage"
                    data-bind="text: percentageText || '0%'">0%</span>
                <span class="text-gr-textMuted font-medium mt-0.5 text-[10px]">completed</span>
            </div>
        </div>
        <!-- Total Stats Info -->
        <div class="text-right">
            <div class="text-gr-textMuted text-xs font-medium">Total completed prayers</div>
            <div class="font-bold text-2xl text-brand tracking-tight leading-none mt-1">
                <span id="perfTotalCompleted" data-ref="page.performance.total-completed"
                    data-bind="text: totalCompleted || 0">0</span>
                <span class="text-gr-textMuted font-normal text-lg" id="perfTotalPossible"
                    data-ref="page.performance.total-possible"
                    data-bind="text: ' / ' + (totalPossible || 0)"> / 0</span>
            </div>
        </div>
    </div>
    <!-- Full-width Date Pill -->
    <div class="w-full text-center py-2 px-3 rounded-full bg-brand-light text-brand text-xs font-medium border border-borderGrey"
        id="perfDatePill" data-bind="text: datePillText || '0 days'">
        0 days
    </div>
</div>
