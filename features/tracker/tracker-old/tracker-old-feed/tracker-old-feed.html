<div class="tracker-feed flex flex-col gap-3" data-bind="attr: { 'data-ref': pagePrefix + '.feed' }">
    <!-- Section 1: Missed Prayers -->
    <section class="prayer-group flex flex-col gap-2" data-bind="attr: { 'data-ref': pagePrefix + '.card.missed-group' }">
        <button type="button" class="group-toggle flex items-center justify-between w-full bg-transparent border-0 p-0 cursor-pointer text-gr-text select-none"
            data-toggle="collapse"
            data-bind="attr: { 'data-target': '#' + collapsePrefix + 'MissedList', 'data-ref': pagePrefix + '.card.missed-group.toggle' }"
            aria-expanded="true">
            <span class="section-title text-xs font-bold uppercase tracking-wider text-gr-text"
                data-bind="text: missedGroupTitle, attr: { id: collapsePrefix + 'MissedTitle', 'data-ref': pagePrefix + '.card.missed-group.title' }">MISSED</span>
            <span class="toggle-icon text-[10px] transition-transform duration-200 inline-block"
                data-bind="attr: { 'data-ref': pagePrefix + '.card.missed-group.icon' }">▼</span>
        </button>
        <div class="collapse show visible" style="visibility: visible;"
            data-bind="attr: { id: collapsePrefix + 'MissedList', 'data-ref': pagePrefix + '.card.missed-group.collapse' }">
            <ul class="prayer-list flex flex-col gap-1.5 list-none p-0 m-0"
                data-bind="attr: { id: collapsePrefix + 'MissedUl', 'data-ref': pagePrefix + '.card.missed-group.list' }">
                <!-- ko if: !hasMissed() -->
                <li class="p-3 text-center text-gr-muted small bg-white rounded-3 border"
                    data-bind="attr: { 'data-ref': pagePrefix + '.missed.empty' }">All prayers completed for this day!</li>
                <!-- /ko -->
                <!-- ko foreach: missedRows -->
                <!-- ko component: {
                    name: 'tracker-old-card',
                    params: {
                        item: $data,
                        prefix: $parent.pagePrefix,
                        onToggle: function(card, event) { $parent.handleToggle(card, event); }
                    }
                } --><!-- /ko -->
                <!-- /ko -->
            </ul>
        </div>
    </section>

    <!-- Section 2: Completed Prayers -->
    <section class="prayer-group flex flex-col gap-2" data-bind="attr: { 'data-ref': pagePrefix + '.card.done-group' }">
        <button type="button" class="group-toggle flex items-center justify-between w-full bg-transparent border-0 p-0 cursor-pointer text-gr-text select-none"
            data-toggle="collapse"
            data-bind="attr: { 'data-target': '#' + collapsePrefix + 'DoneList', 'data-ref': pagePrefix + '.card.done-group.toggle' }"
            aria-expanded="true">
            <span class="section-title text-xs font-bold uppercase tracking-wider text-gr-text"
                data-bind="text: doneGroupTitle, attr: { id: collapsePrefix + 'DoneTitle', 'data-ref': pagePrefix + '.card.done-group.title' }">DONE</span>
            <span class="toggle-icon text-[10px] transition-transform duration-200 inline-block"
                data-bind="attr: { 'data-ref': pagePrefix + '.card.done-group.icon' }">▼</span>
        </button>
        <div class="collapse show visible" style="visibility: visible;"
            data-bind="attr: { id: collapsePrefix + 'DoneList', 'data-ref': pagePrefix + '.card.done-group.collapse' }">
            <ul class="prayer-list flex flex-col gap-1.5 list-none p-0 m-0"
                data-bind="attr: { id: collapsePrefix + 'DoneUl', 'data-ref': pagePrefix + '.card.done-group.list' }">
                <!-- ko if: !hasDone() -->
                <li class="p-3 text-center text-gr-muted small bg-white rounded-3 border"
                    data-bind="attr: { 'data-ref': pagePrefix + '.done.empty' }">No prayers marked done yet.</li>
                <!-- /ko -->
                <!-- ko foreach: doneRows -->
                <!-- ko component: {
                    name: 'tracker-old-card',
                    params: {
                        item: $data,
                        prefix: $parent.pagePrefix,
                        onToggle: function(card, event) { $parent.handleToggle(card, event); }
                    }
                } --><!-- /ko -->
                <!-- /ko -->
            </ul>
        </div>
    </section>
</div>
