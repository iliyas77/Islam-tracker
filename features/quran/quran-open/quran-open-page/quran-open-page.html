<div class="flex flex-col flex-1 min-h-0 bg-white" data-ref="page.quran.open">
    <!-- Top App Bar -->
    <header class="px-4 py-3 flex items-center justify-between bg-white shrink-0 border-b border-[#E0E0E0]">
        <button type="button" aria-label="Back to surah list"
            class="w-10 h-10 rounded-full flat-card flex items-center justify-center text-gray-700 shrink-0 hover:bg-gray-50 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#094E3A]"
            data-bind="click: goBack">
            <i class="fa-solid fa-arrow-left text-lg" aria-hidden="true"></i>
        </button>

        <div class="flex flex-col items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-book-open text-[#094E3A] text-[15px]" aria-hidden="true"></i>
                <h1 class="text-base font-bold text-gray-900 tracking-tight" data-bind="text: readerTitle"></h1>
            </div>
            <span class="text-[11px] text-gray-500 font-medium mt-0.5" data-bind="text: readerSubtitle"></span>
        </div>

        <button type="button" aria-label="Settings"
            class="w-10 h-10 rounded-full flat-card flex items-center justify-center text-gray-700 shrink-0 hover:bg-gray-50 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#094E3A]"
            data-bind="click: goToSettings">
            <i class="fa-solid fa-gear text-lg" aria-hidden="true"></i>
        </button>
    </header>

    <!-- Scrollable reading area -->
    <main class="px-4 py-5 flex-1 min-h-0 space-y-5 overflow-y-auto bg-white" id="quranReaderScroll" data-ref="page.quran.open.scroll">
        <!-- ko component: {
            name: 'quran-open-feed',
            params: {
                surahNum: currentSurahNum,
                ayahs: ayahs,
                isLoading: isLoading,
                hasError: hasError,
                errorMessage: errorMessage,
                activeAudioKey: activeAudioKey,
                bookmarkKeys: bookmarkKeys,
                onBookmarkToggle: handleBookmarkToggle,
                onPlay: handlePlay,
                onRetry: loadCurrentSurah
            }
        } --><!-- /ko -->
    </main>
</div>
