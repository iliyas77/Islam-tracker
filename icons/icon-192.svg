<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123D2E" />
      <stop offset="100%" stop-color="#0A241B" />
    </linearGradient>
    <linearGradient id="goldGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE181" />
      <stop offset="50%" stop-color="#E0BA55" />
      <stop offset="100%" stop-color="#C69214" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)" />

  <!-- Outer gold accent ring -->
  <circle cx="96" cy="96" r="82" fill="none" stroke="url(#goldGrad192)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4 3" />

  <!-- Elegant Crescent Moon -->
  <path d="M 108 52 
           A 46 46 0 1 0 132 130 
           A 38 38 0 1 1 108 52 Z" 
        fill="url(#goldGrad192)" />

  <!-- 8-Pointed Star -->
  <g transform="translate(110, 83) scale(0.48)">
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#goldGrad192)" />
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#goldGrad192)" transform="rotate(45)" />
    <circle cx="0" cy="0" r="10" fill="#123D2E" />
    <circle cx="0" cy="0" r="5" fill="url(#goldGrad192)" />
  </g>
</svg>

