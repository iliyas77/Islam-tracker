<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123D2E" />
      <stop offset="100%" stop-color="#0A241B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE181" />
      <stop offset="50%" stop-color="#E0BA55" />
      <stop offset="100%" stop-color="#C69214" />
    </linearGradient>
    <radialGradient id="nurGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0BA55" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#123D2E" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer gold accent ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="8 6" />

  <!-- Inner ambient Nur glow -->
  <circle cx="256" cy="256" r="180" fill="url(#nurGlow)" />

  <!-- Minaret / Mihrab dome silhouette (subtle background) -->
  <path d="M 216 380 L 216 280 C 216 230 256 195 256 175 C 256 195 296 230 296 280 L 296 380 Z" fill="#0E2F23" opacity="0.7" />

  <!-- Elegant Crescent Moon -->
  <path d="M 285 140 
           A 120 120 0 1 0 350 340 
           A 98 98 0 1 1 285 140 Z" 
        fill="url(#goldGrad)" 
        filter="url(#shadow)" />

  <!-- 8-Pointed Islamic Star (Rub el Hizb) inside crescent -->
  <g transform="translate(290, 220) scale(1.15)" filter="url(#shadow)">
    <!-- Square 1 -->
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#goldGrad)" />
    <!-- Square 2 rotated 45 deg -->
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#goldGrad)" transform="rotate(45)" />
    <!-- Center gem circle -->
    <circle cx="0" cy="0" r="10" fill="#123D2E" />
    <circle cx="0" cy="0" r="5" fill="url(#goldGrad)" />
  </g>

  <!-- Nur (Light) Beads / Starburst highlights -->
  <circle cx="256" cy="115" r="5" fill="url(#goldGrad)" opacity="0.9" />
  <circle cx="370" cy="190" r="3.5" fill="url(#goldGrad)" opacity="0.75" />
  <circle cx="380" cy="280" r="4" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="150" cy="220" r="3.5" fill="url(#goldGrad)" opacity="0.6" />
</svg>

