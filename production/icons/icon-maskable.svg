<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123D2E" />
      <stop offset="100%" stop-color="#0A241B" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE181" />
      <stop offset="50%" stop-color="#E0BA55" />
      <stop offset="100%" stop-color="#C69214" />
    </linearGradient>
  </defs>

  <!-- Full bleed for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)">
    <!-- Outer gold accent ring -->
    <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGradMask)" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="8 6" />

    <!-- Crescent Moon -->
    <path d="M 285 140 
             A 120 120 0 1 0 350 340 
             A 98 98 0 1 1 285 140 Z" 
          fill="url(#goldGradMask)" />

    <!-- 8-Pointed Star -->
    <g transform="translate(290, 220) scale(1.15)">
      <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#goldGradMask)" />
      <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#goldGradMask)" transform="rotate(45)" />
      <circle cx="0" cy="0" r="10" fill="#123D2E" />
      <circle cx="0" cy="0" r="5" fill="url(#goldGradMask)" />
    </g>
  </g>
</svg>

